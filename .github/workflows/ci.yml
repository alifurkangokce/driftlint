name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: install mcp package dependencies
        working-directory: mcp
        run: npm install --no-save ../
      - name: build mcp package
        working-directory: mcp
        run: npm run build
      - run: npm test
      - name: self-scan
        run: node dist/cli.js . --no-fail
      - name: twins mirror is in sync
        run: node dist/cli.js twins . --check
