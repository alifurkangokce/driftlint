name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: build mcp package
        run: |
          cd mcp
          npm install --no-save ../ "@modelcontextprotocol/sdk@^1.30.0" "zod@^3.25.0" "@types/node@^20.14.0" "typescript@^5.5.0"
          npx tsc -p tsconfig.json
      - run: npm test
      - name: self-scan
        run: node dist/cli.js . --no-fail
