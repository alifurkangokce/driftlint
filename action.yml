name: "driftlint context linter"
description: "Find the claims in your agent context files (CLAUDE.md, AGENTS.md, skills) that your code no longer supports."
branding:
  icon: "alert-triangle"
  color: "orange"
inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  skill-budget:
    description: "System-prompt char budget for skill descriptions"
    required: false
    default: "15000"
  fail:
    description: "Fail the job when errors are found"
    required: false
    default: "true"
  diff:
    description: "On pull_request events, report only drift THIS PR caused (uses the PR base as baseline)"
    required: false
    default: "false"
  badge-json:
    description: "Write a shields.io endpoint-badge JSON (context-freshness score) to this path"
    required: false
    default: ""
  sarif-file:
    description: "Also write SARIF here and upload it to GitHub code scanning (requires 'security-events: write' permission)"
    required: false
    default: ""
  annotations:
    description: "Annotate findings inline on the PR with workflow commands — works on private repos without GitHub Advanced Security. Skipped when sarif-file is set, to avoid duplicates."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Run driftlint
      shell: bash
      run: |
        ARGS="${{ inputs.path }} --skill-budget ${{ inputs.skill-budget }}"
        if [ "${{ inputs.fail }}" != "true" ]; then
          ARGS="$ARGS --no-fail"
        fi
        if [ -n "${{ inputs.badge-json }}" ]; then
          ARGS="$ARGS --badge-json ${{ inputs.badge-json }}"
        fi
        if [ "${{ inputs.diff }}" = "true" ] && [ -n "$GITHUB_BASE_REF" ]; then
          git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF" || true
          ARGS="$ARGS --diff origin/$GITHUB_BASE_REF...HEAD"
        fi
        npx -y @alifurkangokce/driftlint@0.20.0 $ARGS
    - name: Annotate findings
      if: ${{ inputs.annotations == 'true' && inputs.sarif-file == '' && (success() || failure()) }}
      shell: bash
      run: npx -y @alifurkangokce/driftlint@0.20.0 ${{ inputs.path }} --skill-budget ${{ inputs.skill-budget }} --format github --no-fail
    - name: Write SARIF
      if: ${{ inputs.sarif-file != '' && (success() || failure()) }}
      shell: bash
      run: npx -y @alifurkangokce/driftlint@0.20.0 ${{ inputs.path }} --skill-budget ${{ inputs.skill-budget }} --sarif --no-fail > "${{ inputs.sarif-file }}"
    - name: Upload SARIF to code scanning
      if: ${{ inputs.sarif-file != '' && (success() || failure()) }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
